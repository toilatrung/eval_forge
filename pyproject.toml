[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-forge"
version = "0.1.0"
description = "LLM Evaluation Harness + Internal Platform"
requires-python = ">=3.10"

# Dependency version thật (pin cứng) nằm ở requirements.txt — pyproject.toml chỉ dùng để
# cài eval_forge ở dạng editable (`pip install -e .`), giúp `import eval_forge` chạy được
# từ mọi nơi (kể cả `streamlit run ui/app.py`) mà không cần chỉnh sys.path thủ công.

[tool.setuptools.packages.find]
where = ["src"]
